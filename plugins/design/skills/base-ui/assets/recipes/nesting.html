<!-- Semantic depth does not require repeated padded cards. One surface owns the margin. -->
<section class="card__root flow__root" aria-labelledby="nesting-title" data-spacing="loose" data-nesting-example>
  <header class="heading-group__root"><h2 id="nesting-title">Collection access</h2><p>Review the scope and its nested collection settings.</p></header>
  <section class="flow__root" aria-labelledby="collection-title" data-nesting-level="2">
    <h3 id="collection-title">Local press collection</h3>
    <section class="flow__root" aria-labelledby="access-title" data-nesting-level="3">
      <h4 id="access-title">Access requirements</h4>
      <fieldset class="field-group__root" data-surface="plain"><legend>Included material</legend><div class="options__root">
        <label class="choice__root"><input class="checkbox__control" type="checkbox" checked><span>Regional newspaper editions with a deliberately long label that wraps naturally on narrow screens</span></label>
        <label class="choice__root"><input class="checkbox__control" type="checkbox"><span>Supplementary catalog records</span></label>
      </div></fieldset>
      <div class="field__root"><label for="nested-note">Review note</label><textarea id="nested-note">Retain the collection hierarchy without repeating decorative containers.</textarea></div>
    </section>
  </section>
</section>
