<section class="section-flow__root section__flow product__root" data-review-id="notification-choice">
<header class="heading-group__root"><h2>Notifications</h2><p>Choose one channel for account updates.</p></header>
<fieldset class="field-group__root" data-surface="plain"><legend>Notification preference</legend><div class="options__root">
<label class="choice__root"><input class="radio__control" type="radio" name="channel" value="Email" checked><span class="choice__body"><strong>Email</strong><span class="choice__description">Updates in your inbox.</span></span></label>
<label class="choice__root"><input class="radio__control" type="radio" name="channel" value="In-app"><span class="choice__body"><strong>In-app</strong><span class="choice__description">Updates while using the app.</span></span></label>
</div></fieldset><div class="cluster__root"><button class="button__root" type="button" data-save>Save</button><output role="status" data-saved></output></div>
</section>
