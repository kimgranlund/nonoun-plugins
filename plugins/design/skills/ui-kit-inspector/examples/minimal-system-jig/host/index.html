<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal host</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; padding: 24px; background: oklch(0.96 0 0); }
  main { max-width: 360px; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h2 class="card-title">Sign in</h2>
    <p class="card-text">Use the email you registered with.</p>
    <label class="field">
      <span class="field-label">Email</span>
      <input class="input" type="email" placeholder="you@example.com">
    </label>
    <div class="actions">
      <button class="button" type="button">Cancel</button>
      <button class="button button-primary" type="button">Continue</button>
    </div>
  </section>
</main>
</body>
</html>
