# Companion to broken-pipeline.yaml: the question set behind its final model step (big-model).
# It passes decision-questions' validate_questions.py, yet trips two pipeline rules: role checker
# while routed resolvers act on their own (question-set-role), and a review band of 0, so the
# final step never abstains (no-fallthrough).
id: intake-checker
version: 1
model: example-model-2026-11-01
shape: single-choice
role: checker
gate_ids: []
questions:
  - id: kind
    kind: choice
    instructions: >-
      Choose the one option that best describes the document.
      If the document is a signed order form, the answer is contract.
    options:
      contract:
        definition: The document is an agreement that binds the company to a counterparty.
        examples: ["Mutual NDA between Acme and Example Ltd."]
      policy:
        definition: The document is an internal rule that staff must follow.
        examples: ["Travel expense policy, version 4."]
      complaint:
        definition: The document is a grievance from a customer.
        examples: ["Formal complaint about a late refund."]
      none:
        definition: The document belongs to a kind outside this list.
        examples: ["A lunch menu.", "A conference flyer."]
decisions:
  - id: kind-flag
    mode: threshold
    inputs: [kind]
    bands: {act: 0.9, review: 0}
    outcome: flag
