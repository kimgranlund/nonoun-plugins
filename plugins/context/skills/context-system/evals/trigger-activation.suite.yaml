    prompt: We call it a workspace in the API and a project in the UI. Which should the docs use?
  expected:
    activates: true
    behavior: Checks or seeds `vocabulary.yaml`, picks one `prefLabel` with evidence from both files, records the other as `altLabel` or `hiddenLabel`, and rewrites the docs in the same change.
  tags:
  - should-activate
  - vocabulary
  source: synthetic
  added_because: 'brief trigger list: the same thing named differently across files (docs/specs/new-skills/knowledge-organization-system.md, Frontmatter and triggers)'
  added_at: 2026-11-01
