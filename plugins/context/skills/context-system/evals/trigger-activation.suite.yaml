# This skill's trigger suite, in evaluation-system suite format. Run it when you change the skill's
# description or scope: run each prompt in a fresh session with the plugin installed, record whether
# the skill activated, which layer it routed to, and whether it behaved as `expected.behavior` says, then run:
#   python3 ../evaluation-system/scripts/run_suite.py evals/trigger-activation.suite.yaml --human-results <recorded.yaml> --out <dir>
# A recorded result is {case_id, grader_id: observed-activation, outcome: pass|fail, detail}.
# Pass means the observed activation equals expected.activates. A description change passes when every case passes.
# Merged 2026-11-12 from the vocabulary (v-) and statements (s-) suites; the layer tag on each positive case names
# the section of SKILL.md the request must route to.
id: context-system-trigger-activation
version: 1
target: context-system skill description (SKILL.md frontmatter)
target_spec:
- When a prompt asks how a corpus names, models, classifies, phrases, indexes or routes its knowledge (vocabulary, ontology, manifests, registries, entry files, route tests, governed statements), the skill
  shall activate and name the layer it works in.
- When a prompt asks for casual prose, marketing copy, ordinary code or UI work, formal OWL or RDF work, translation, trace diagnosis, triage pipelines or evaluation design, the skill shall not activate.
graders:
- id: observed-activation
  kind: human
slices:
- should-activate
- should-not-activate
cases:
- id: v-a1
