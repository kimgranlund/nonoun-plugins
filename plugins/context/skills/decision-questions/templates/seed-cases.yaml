# Stage 0 seed cases for templates/question-set.yaml: 10 to 20 real messages, ambiguous ones
# included, each with who decided the answer (basis) and where it came from (added_because).
# Turn them into an evaluation-system suite with scripts/make_eval_cases.py. Replace them with
# items from your own domain; never with answers a rule already derives (convention gold
# inflates judgment accuracy).
