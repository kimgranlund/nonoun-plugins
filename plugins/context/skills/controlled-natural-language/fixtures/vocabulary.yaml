# It is test data, not a term source: the test runs validate_kos.py on it.
schemes:
  - id: shop
    definition: Requirements and runbooks of a web shop's checkout.

concepts:
  - id: checkout-service
    prefLabel: checkout service
    altLabel: [checkout]
    hiddenLabel: [cart service]
    definition: The backend component that turns a basket into a paid order.
