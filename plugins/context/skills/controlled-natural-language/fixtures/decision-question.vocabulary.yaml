# lint tests. It is test data, not a term source: the test runs validate_kos.py on it.
schemes:
  - id: support
    definition: Teams that answer customer messages in a support queue.

concepts:
  - id: billing
    prefLabel: billing
    definition: The team that answers questions about charges on an invoice.
    scheme: support
    evidence: [questions/triage.md:9]
